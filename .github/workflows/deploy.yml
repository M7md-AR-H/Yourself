name: Deploy to GitHub Pages
# Publishes the built app to the `gh-pages` branch. GitHub serves that branch at
# https://<owner>.github.io/<repo>/ (Pages is usually switched on automatically
# the first time this branch appears; otherwise see OWNER_TASKS.md §1).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Publish dist/ to gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Point Pages at gh-pages (works only if the token is allowed; harmless otherwise)
        continue-on-error: true
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" \
            || echo "Could not change Pages settings with this token."
          gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url + "  status=" + (.status // "unknown")' || true
